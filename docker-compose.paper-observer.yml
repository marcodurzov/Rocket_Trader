services:
  rocket-trader-paper-observer:
    build:
      context: .
      dockerfile: Dockerfile.paper-observer
    container_name: rocket-trader-paper-observer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ROCKET_TRADER_RUNTIME_MODE: OBSERVE_ONLY
      ROCKET_TRADER_RUNTIME_DB: /app/data/runtime.sqlite3
      ROCKET_TRADER_EQUITY_SYMBOLS: SPY,QQQ,IWM
      ROCKET_TRADER_CRYPTO_SYMBOLS: BTC/USD,ETH/USD,SOL/USD
      ROCKET_TRADER_ACTIVITY_STAGER_ENABLED: "true"
      ROCKET_TRADER_ACTIVITY_STAGER_DB: /app/data/rocket_trader_activity_stager.sqlite3
      ROCKET_TRADER_LEDGER_ENABLED: "true"
      ROCKET_TRADER_LEDGER_DB: /app/data/rocket_trader_ledger.sqlite3
      ROCKET_TRADER_LEDGER_INBOX_DB: /app/data/rocket_trader_fill_inbox.sqlite3
      ROCKET_TRADER_INITIAL_CAPITAL_MXN: "1000.00"
      ROCKET_TRADER_MILESTONE_MXN: "100000.00"
    volumes:
      - rocket_trader_data:/app/data
    healthcheck:
      test: ["CMD", "python", "/app/rocket_trader_stream_runtime.py", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  rocket-trader-regime-observer:
    build:
      context: .
      dockerfile: Dockerfile.paper-observer
    container_name: rocket-trader-regime-observer
    restart: unless-stopped
    environment:
      ROCKET_TRADER_RUNTIME_DB: /app/data/runtime.sqlite3
      ROCKET_TRADER_REGIME_DB: /app/data/regime_decisions.sqlite3
    command: ["python", "/app/rocket_trader_regime_observer.py", "--poll-forever"]
    volumes:
      - rocket_trader_data:/app/data
    healthcheck:
      test: ["CMD", "python", "/app/rocket_trader_regime_observer.py", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  rocket-trader-alpaca-news:
    build:
      context: .
      dockerfile: Dockerfile.paper-observer
    container_name: rocket-trader-alpaca-news
    restart: unless-stopped
    environment:
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      ROCKET_TRADER_ALPACA_NEWS_DB: /app/data/rocket_trader_alpaca_news.sqlite3
      ROCKET_TRADER_ALPACA_NEWS_SYMBOLS: ${ROCKET_TRADER_ALPACA_NEWS_SYMBOLS:-SPY,QQQ,IWM,BTCUSD,ETHUSD,SOLUSD}
    command: ["python", "/app/rocket_trader_alpaca_news_observer.py", "--poll-forever"]
    volumes:
      - rocket_trader_data:/app/data
    healthcheck:
      test: ["CMD", "python", "/app/rocket_trader_alpaca_news_observer.py", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  rocket-trader-gdelt-news:
    build:
      context: .
      dockerfile: Dockerfile.paper-observer
    container_name: rocket-trader-gdelt-news
    restart: unless-stopped
    environment:
      ROCKET_TRADER_GDELT_NEWS_DB: /app/data/rocket_trader_gdelt_news.sqlite3
    command: ["python", "/app/rocket_trader_gdelt_news_observer.py", "--poll-forever"]
    volumes:
      - rocket_trader_data:/app/data
    healthcheck:
      test: ["CMD", "python", "/app/rocket_trader_gdelt_news_observer.py", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  rocket-trader-official-news:
    build:
      context: .
      dockerfile: Dockerfile.paper-observer
    container_name: rocket-trader-official-news
    restart: unless-stopped
    environment:
      ROCKET_TRADER_OFFICIAL_NEWS_DB: /app/data/rocket_trader_official_news.sqlite3
      SEC_CONTACT_EMAIL: ${SEC_CONTACT_EMAIL:-}
    command: ["python", "/app/rocket_trader_official_news.py", "--poll-forever"]
    volumes:
      - rocket_trader_data:/app/data
    healthcheck:
      test: ["CMD", "python", "/app/rocket_trader_official_news.py", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  rocket_trader_data:
