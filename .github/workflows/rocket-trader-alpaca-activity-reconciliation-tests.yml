name: Rocket Trader - Alpaca Activity Reconciliation Tests

on:
  push:
    branches:
      - main
      - "feat/alpaca-fill-and-fee-reconciliation"
    paths:
      - "rocket_trader_alpaca_activity_reconciliation.py"
      - "rocket_trader_alpaca_activity_reconciliation_test.py"
      - ".github/workflows/rocket-trader-alpaca-activity-reconciliation-tests.yml"
      - "rocket_trader_execution_event_ledger.py"
  pull_request:
    branches:
      - main
    paths:
      - "rocket_trader_alpaca_activity_reconciliation.py"
      - "rocket_trader_alpaca_activity_reconciliation_test.py"
      - ".github/workflows/rocket-trader-alpaca-activity-reconciliation-tests.yml"
      - "rocket_trader_execution_event_ledger.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpaca-activity-reconciliation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile
        run: |
          python -m py_compile rocket_trader_alpaca_activity_reconciliation.py rocket_trader_alpaca_activity_reconciliation_test.py

      - name: Run offline activity reconciliation tests
        run: python -m unittest -v rocket_trader_alpaca_activity_reconciliation_test.py
