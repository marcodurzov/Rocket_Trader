name: Rocket Trader - Crypto Multi-year Benchmark Research v0.3 (next-open)

on:
  push:
    branches:
      - main
      - "research/mean-reversion-next-open"
    paths:
      - "rocket_trader_crypto_multiyear_research_v0_3.py"
      - "rocket_trader_crypto_multiyear_research_v0_3_test.py"
      - ".github/workflows/rocket-trader-crypto-multiyear-research-v0.3.yml"
  pull_request:
    branches:
      - main
    paths:
      - "rocket_trader_crypto_multiyear_research_v0_3.py"
      - ".github/workflows/rocket-trader-crypto-multiyear-research-v0.3.yml"
  workflow_dispatch:
    inputs:
      years:
        description: Calendar years of daily crypto data (minimum 3)
        required: false
        default: '5'
        type: string
      symbols:
        description: Space-separated USD crypto pairs
        required: false
        default: 'BTC/USD ETH/USD SOL/USD'
        type: string
  schedule:
    - cron: '0 16 * * 0'

permissions:
  contents: read

concurrency:
  group: rocket-trader-crypto-multiyear-research
  cancel-in-progress: false

jobs:
  crypto-research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-alpaca.txt
      - name: Offline self-test
        run: python rocket_trader_crypto_multiyear_research_v0_3.py --self-test
      - name: Offline regression tests
        run: python -m unittest -v rocket_trader_crypto_multiyear_research_v0_3_test.py
      - name: Run multi-year crypto research
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/research/mean-reversion-next-open'))
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          YEARS_INPUT: ${{ inputs.years || '5' }}
          SYMBOLS_INPUT: ${{ inputs.symbols || 'BTC/USD ETH/USD SOL/USD' }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a symbols <<< "$SYMBOLS_INPUT"
          python rocket_trader_crypto_multiyear_research_v0_3.py \
            --symbols "${symbols[@]}" \
            --years "$YEARS_INPUT" \
            --output research_artifacts/crypto_multiyear_research_v0_3.json
      - name: Verify research-only report
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/research/mean-reversion-next-open'))
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('research_artifacts/crypto_multiyear_research_v0_3.json').read_text())
          assert data.get('orders_enabled') is False
          assert data.get('orders_submitted') == 0
          assert data.get('candidate_promotion_allowed') is False
          assert data.get('paper_approval') is False
          assert data.get('ok') is True
          mt=data['multiple_testing']
          assert mt['method'] == 'HOLM_BONFERRONI'
          assert mt['promotion_allowed'] is False
          assert mt['family_size'] == len(mt['raw_pvalues']) == len(mt['holm_adjusted_pvalues'])
          assert all(0 <= p <= 1 for p in mt['holm_adjusted_pvalues'].values())
          print('Research-only report verified:', data['symbols_processed'])
          print('Multiple-testing family size:', mt['family_size'])
          print('Family-wise significant hypotheses:', mt['familywise_significant_count'])
          print('Data quality pass:', data.get('data_quality_pass'))
          print('Symbols with data-quality issues:', data.get('symbols_with_data_quality_issues'))
          PY
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/research/mean-reversion-next-open')))
        with:
          name: rocket-trader-crypto-multiyear-research-v0-3
          path: research_artifacts/
          if-no-files-found: warn
          retention-days: 30
