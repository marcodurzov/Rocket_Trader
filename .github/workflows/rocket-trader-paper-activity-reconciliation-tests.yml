name: Rocket Trader - Paper Activity Reconciliation Tests

on:
  push:
    branches:
      - main
    paths:
      - "rocket_trader_paper_activity_reconciliation.py"
      - "rocket_trader_paper_activity_reconciliation_test.py"
      - ".github/workflows/rocket-trader-paper-activity-reconciliation-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "rocket_trader_paper_activity_reconciliation.py"
      - "rocket_trader_paper_activity_reconciliation_test.py"
      - ".github/workflows/rocket-trader-paper-activity-reconciliation-tests.yml"

permissions:
  contents: read

jobs:
  paper-activity-reconciliation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile rocket_trader_paper_activity_reconciliation.py rocket_trader_paper_activity_reconciliation_test.py
      - name: Run offline read-only reconciliation tests
        run: python -m unittest -v rocket_trader_paper_activity_reconciliation_test.py
