name: Rocket Trader - News Ingestion Tests

on:
  push:
    branches:
      - "feat/point-in-time-news-ingestion-and-ledger"
    paths:
      - "rocket_trader_news.py"
      - "rocket_trader_news_test.py"
      - "requirements-alpaca.txt"
      - ".github/workflows/rocket-trader-news-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Alpaca SDK
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-alpaca.txt

      - name: Compile news ingestion modules
        run: python -m py_compile rocket_trader_news.py rocket_trader_news_test.py

      - name: Run point-in-time and deduplication tests
        run: python rocket_trader_news_test.py

      - name: Verify read-only Alpaca News API access
        run: python rocket_trader_news_test.py --alpaca-api
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
