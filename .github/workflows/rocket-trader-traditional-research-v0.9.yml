
name: Rocket Trader - Traditional Research v0.9 Audit

on:
  workflow_dispatch:
    inputs:
      research_run_id:
        description: "Run ID of the successful Traditional Research v0.2 workflow"
        required: true
        default: "39855884241"
        type: string

  workflow_run:
    workflows:
      - "Rocket Trader - Traditional Research v0.2"
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: rocket-trader-traditional-research-v09-audit
  cancel-in-progress: false

jobs:
  preflight-and-audit:
    name: preflight-and-audit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify auditor
        run: |
          test -f rocket_trader_traditional_research_v0_9.py
          python -m py_compile rocket_trader_traditional_research_v0_9.py

      - name: Run auditor self-tests
        run: |
          python rocket_trader_traditional_research_v0_9.py --run-tests

      - name: Determine source research run
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_RUN_ID: ${{ inputs.research_run_id }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            RUN_ID="$WORKFLOW_RUN_ID"
          else
            RUN_ID="$MANUAL_RUN_ID"
          fi

          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid research run ID: $RUN_ID"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Research source run: $RUN_ID"

      - name: Download research artifact
        uses: actions/download-artifact@v4
        with:
          name: rocket-trader-traditional-research-v0-2-report
          path: downloaded_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Inspect downloaded artifact
        shell: bash
        run: |
          echo "Downloaded artifact contents:"
          find downloaded_artifact -maxdepth 6 -type f -print

          if [[ ! -d downloaded_artifact ]]; then
            echo "ERROR: Download directory does not exist."
            exit 1
          fi

          COUNT=$(find downloaded_artifact -type f \
            \( -iname '*.json' -o -iname '*.csv' \) | wc -l)

          echo "Supported files found: $COUNT"

          if [[ "$COUNT" -eq 0 ]]; then
            echo "ERROR: Artifact contains no JSON or CSV files."
            exit 1
          fi

      - name: Prepare clean audit input
        shell: bash
        run: |
          mkdir -p audit_input audit_output

          python - <<'PY'
          from pathlib import Path
          import shutil

          source = Path("downloaded_artifact")
          destination = Path("audit_input")

          supported = []
          for path in source.rglob("*"):
              if path.is_file() and path.suffix.lower() in {".json", ".csv"}:
                  supported.append(path)

          if not supported:
              raise SystemExit("ERROR: No supported files found.")

          copied = []

          for index, path in enumerate(sorted(supported), start=1):
              target = destination / f"source_{index:03d}_{path.name}"
              shutil.copy2(path, target)
              copied.append(target)

          print("Files copied into clean audit directory:")
          for path in copied:
              print(f" - {path}")

          if not any(p.suffix.lower() == ".json" for p in copied):
              raise SystemExit("ERROR: No JSON research report was copied.")
          PY

      - name: Validate research JSON files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          files = list(Path("audit_input").glob("*.json"))

          if not files:
              raise SystemExit("ERROR: audit_input contains no JSON files.")

          for path in files:
              print(f"Validating: {path}")
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)

          print(f"Validated {len(files)} JSON file(s).")
          PY

      - name: Run artifact audit
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set +e

          python rocket_trader_traditional_research_v0_9.py \
            --input-dir audit_input \
            --output audit_output/v0_9_audit_report.json \
            --strict-no-data

          RC=$?
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"

          echo "Auditor exit code: $RC"
          exit "$RC"

      - name: Display audit report
        if: always()
        shell: bash
        run: |
          REPORT="audit_output/v0_9_audit_report.json"

          if [[ -f "$REPORT" ]]; then
            python -m json.tool "$REPORT"
          else
            echo "ERROR: Auditor did not generate its report."
          fi

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocket-trader-traditional-research-v0.9-audit
          path: |
            audit_output/
            audit_input/
            downloaded_artifact/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          REPORT="audit_output/v0_9_audit_report.json"

          {
            echo "## Rocket Trader - Research Audit"
            echo ""

            if [[ -f "$REPORT" ]]; then
              python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("audit_output/v0_9_audit_report.json").read_text()
          )

          print(f"- Status: **{report.get('audit_status', 'UNKNOWN')}**")
          print(f"- Files scanned: {report.get('files_scanned', 0)}")
          print(f"- Reports scanned: {report.get('reports_scanned', 0)}")
          print(f"- CSV files scanned: {report.get('csv_files_scanned', 0)}")
          print(f"- Trade rows scanned: {report.get('trade_rows_scanned', 0)}")
          print(f"- Errors: {report.get('error_count', 0)}")
          print(f"- Warnings: {report.get('warning_count', 0)}")
          print("- Live orders: DISABLED")
          print("- Strategy promotion: DISABLED")
          print("- Profitability independently verified: NO")

          print("\n### Findings")
          for item in report.get("findings", []):
              print(
                  f"- [{item.get('severity', 'UNKNOWN')}] "
                  f"{item.get('code', 'UNKNOWN')}: "
                  f"{item.get('message', '')}"
              )
          PY
            else
              echo "Audit report was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce audit gate
        if: always()
        shell: bash
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          if [[ -z "$AUDIT_EXIT_CODE" ]]; then
            echo "ERROR: Audit did not produce an exit code."
            exit 1
          fi

          if [[ "$AUDIT_EXIT_CODE" != "0" ]]; then
            echo "ERROR: Audit failed with exit code $AUDIT_EXIT_CODE."
            exit 1
          fi

          echo "Audit gate passed."
