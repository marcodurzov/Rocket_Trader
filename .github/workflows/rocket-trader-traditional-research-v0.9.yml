
name: Rocket Trader - Traditional Research v0.9 Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "rocket_trader_traditional_research_v0_9.py"
      - "research_artifacts/**"
      - ".github/workflows/rocket-trader-traditional-research-v0.9.yml"

permissions:
  contents: read

jobs:
  preflight-and-audit:
    name: preflight-and-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify expected files
        shell: bash
        run: |
          test -f rocket_trader_traditional_research_v0_9.py
          head -n 1 rocket_trader_traditional_research_v0_9.py | grep -q 'python'

      - name: Compile syntax
        run: python -m py_compile rocket_trader_traditional_research_v0_9.py

      - name: Run unit and regression tests
        run: python rocket_trader_traditional_research_v0_9.py --run-tests

      - name: Prepare research artifact directory
        run: mkdir -p research_artifacts

      - name: Run artifact audit
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python rocket_trader_traditional_research_v0_9.py \
            --input-dir research_artifacts \
            --output research_artifacts/v0_9_audit_report.json \
            --strict-no-data
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocket-trader-traditional-research-v0.9-audit
          path: research_artifacts/v0_9_audit_report.json
          if-no-files-found: error
          retention-days: 30

      - name: Add audit summary
        if: always()
        shell: bash
        run: |
          report="research_artifacts/v0_9_audit_report.json"

          {
            echo "## Rocket Trader research audit"
            echo ""

            if [[ -f "$report" ]]; then
              jq -r '"- **Audit status:** `" + (.audit_status // "UNKNOWN") + "`"' "$report"
              jq -r '"- Files scanned: " + ((.files_scanned // 0) | tostring)' "$report"
              jq -r '"- Trade rows scanned: " + ((.trade_rows_scanned // 0) | tostring)' "$report"
              jq -r '"- Errors: " + ((.error_count // 0) | tostring)' "$report"
              jq -r '"- Warnings: " + ((.warning_count // 0) | tostring)' "$report"

              echo "- Strategy profitability independently verified: **No**"
              echo "- Live orders enabled: **No**"
              echo ""
              echo "### Findings"

              if jq -e '(.findings // []) | length > 0' "$report" >/dev/null; then
                jq -r '(.findings // [])[] | "- `" + (.severity // "UNKNOWN") + "` `" + (.code // "UNKNOWN") + "`: " + (.message // "No message")' "$report"
              else
                echo "- No structured findings listed in the report."
              fi
            else
              echo "Audit report was not generated; inspect earlier steps."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          test -f "$report"

      - name: Enforce audit gate
        if: always()
        shell: bash
        run: |
          audit_rc="${{ steps.audit.outputs.exit_code }}"

          if [[ -z "$audit_rc" ]]; then
            echo "Audit did not produce an exit code; failing closed."
            exit 1
          fi

          if [[ "$audit_rc" != "0" ]]; then
            echo "Audit gate failed with exit code $audit_rc."
            echo "If status is NO_DATA, add valid research JSON/CSV inputs to research_artifacts/."
            exit 1
          fi
