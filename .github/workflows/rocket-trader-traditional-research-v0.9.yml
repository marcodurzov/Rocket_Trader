name: Rocket Trader - Traditional Research v0.9 Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "rocket_trader_traditional_research_v0_9.py"
      - "research_artifacts/**"
      - ".github/workflows/rocket-trader-traditional-research-v0.9.yml"

permissions:
  contents: read

jobs:
  preflight-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "false"

      - name: Compile syntax
        run: python -m py_compile rocket_trader_traditional_research_v0_9.py

      - name: Run unit and regression tests
        run: python rocket_trader_traditional_research_v0_9.py --run-tests

      - name: Ensure research artifact directory exists
        run: mkdir -p research_artifacts

      - name: Audit available research artifacts
        id: audit
        continue-on-error: true
        run: |
          python rocket_trader_traditional_research_v0_9.py \
            --input-dir research_artifacts \
            --output research_artifacts/v0_9_audit_report.json

      - name: Summarize audit status
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path("research_artifacts/v0_9_audit_report.json")
          if p.exists():
              report = json.loads(p.read_text(encoding="utf-8"))
              status = report.get("audit_status", "UNKNOWN")
              files = report.get("files_scanned", 0)
              rows = report.get("trade_rows_scanned", 0)
              errors = report.get("error_count", 0)
              warnings = report.get("warning_count", 0)
              lines = ["## Rocket Trader artifact audit", f"- **Status:** `{status}`", f"- Files scanned: {files}", f"- Trade rows scanned: {rows}", f"- Errors: {errors}", f"- Warnings: {warnings}"]
              if status == "NO_DATA":
                  lines.append("- **Interpretation:** preflight/tests passed, but no research data was available to audit. This is not an audit pass and does not permit strategy promotion.")
              elif status == "PASS":
                  lines.append("- **Interpretation:** implemented artifact checks passed; profitability remains unverified.")
          else:
              lines = ["## Rocket Trader artifact audit", "- No audit report was generated; inspect the audit step logs."]
          lines.append(f"- Audit step outcome: `{os.environ.get('AUDIT_OUTCOME', 'unknown')}`")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\\n".join(lines) + "\\n")
          PY

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocket-trader-traditional-research-v0.9-audit
          path: research_artifacts/v0_9_audit_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail workflow on actual audit errors
        if: steps.audit.outcome == 'failure'
        run: exit 1
