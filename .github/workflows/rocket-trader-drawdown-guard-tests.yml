name: Rocket Trader - Persistent Drawdown Guard Tests

on:
  push:
    branches: [main]
    paths:
      - "rocket_trader_drawdown_guard.py"
      - "rocket_trader_drawdown_guard_test.py"
      - "rocket_trader_core.py"
      - ".github/workflows/rocket-trader-drawdown-guard-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "rocket_trader_drawdown_guard.py"
      - "rocket_trader_drawdown_guard_test.py"
      - "rocket_trader_core.py"
      - ".github/workflows/rocket-trader-drawdown-guard-tests.yml"

jobs:
  drawdown-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run persistent drawdown guard tests
        run: python -m unittest -v rocket_trader_drawdown_guard_test.py
