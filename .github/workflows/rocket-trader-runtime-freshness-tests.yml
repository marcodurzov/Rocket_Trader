name: Rocket Trader Runtime Freshness Tests

on:
  pull_request:
    paths:
      - "rocket_trader_stream_runtime.py"
      - "rocket_trader_stream_runtime_test.py"
      - ".github/workflows/rocket-trader-runtime-freshness-tests.yml"
  push:
    branches: [main]
    paths:
      - "rocket_trader_stream_runtime.py"
      - "rocket_trader_stream_runtime_test.py"
      - ".github/workflows/rocket-trader-runtime-freshness-tests.yml"

permissions:
  contents: read

jobs:
  runtime-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile observer runtime and tests
        run: python -m py_compile rocket_trader_stream_runtime.py rocket_trader_stream_runtime_test.py
      - name: Run observer runtime unit tests
        run: python -m unittest -v rocket_trader_stream_runtime_test.py
