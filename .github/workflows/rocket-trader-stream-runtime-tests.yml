name: Rocket Trader - Paper Observer Runtime Tests

on:
  push:
    branches: [main]
    paths:
      - "rocket_trader_stream_runtime.py"
      - "rocket_trader_stream_runtime_test.py"
      - "rocket_trader_paper_reconciliation.py"
      - "rocket_trader_paper_reconciliation_test.py"
      - "rocket_trader_realized_pnl_ledger.py"
      - "rocket_trader_realized_pnl_ledger_test.py"
      - "PAPER_OBSERVER_RUNTIME.md"
      - "rocket_trader_realized_pnl_ledger.py"
      - "rocket_trader_paper_fill_ledger_bridge.py"
      - "rocket_trader_alpaca_fee_resolver.py"
      - "rocket_trader_fx_provider.py"
      - "rocket_trader_currency.py"
      - "rocket_trader_paper_activity_reconciliation.py"
      - "rocket_trader_paper_activity_reconciliation_test.py"
      - "rocket_trader_paper_reconciliation.py"
      - "rocket_trader_paper_reconciliation_test.py"
      - "rocket_trader_alpaca_activity_stager.py"
      - "rocket_trader_alpaca_cash_activity_bridge.py"
      - "rocket_trader_alpaca_cash_activity_bridge_test.py"
      - "rocket_trader_alpaca_yahoo_etf_crosscheck.py"
      - "rocket_trader_alpaca_yahoo_etf_crosscheck_test.py"
      - "MARKET_DATA_SOURCE_AUDIT.md"
      - "rocket_trader_alpaca_activity_stager_test.py"
      - "rocket_trader_regime_observer.py"
      - "rocket_trader_regime_selector.py"
      - "rocket_trader_news_event_assessment.py"
      - "rocket_trader_execution_cost_telemetry.py"
      - "PAPER_EXECUTION_COST_TELEMETRY.md"
      - "tests/test_rocket_trader_execution_cost_telemetry.py"
      - "tests/test_rocket_trader_regime_observer.py"
      - "tests/test_rocket_trader_regime_selector.py"
      - "tests/test_rocket_trader_news_event_assessment.py"
      - ".github/workflows/rocket-trader-stream-runtime-tests.yml"
      - "requirements-yahoo.txt"
  pull_request:
    branches: [main]
    paths:
      - "rocket_trader_stream_runtime.py"
      - "rocket_trader_stream_runtime_test.py"
      - "PAPER_OBSERVER_RUNTIME.md"
      - "rocket_trader_realized_pnl_ledger.py"
      - "rocket_trader_paper_fill_ledger_bridge.py"
      - "rocket_trader_alpaca_fee_resolver.py"
      - "rocket_trader_fx_provider.py"
      - "rocket_trader_currency.py"
      - "rocket_trader_paper_activity_reconciliation.py"
      - "rocket_trader_paper_activity_reconciliation_test.py"
      - "rocket_trader_paper_reconciliation.py"
      - "rocket_trader_paper_reconciliation_test.py"
      - "rocket_trader_alpaca_activity_stager.py"
      - "rocket_trader_alpaca_cash_activity_bridge.py"
      - "rocket_trader_alpaca_cash_activity_bridge_test.py"
      - "rocket_trader_cash_activity_admin.py"
      - "Dockerfile.paper-observer"
      - "rocket_trader_regime_observer.py"
      - "rocket_trader_regime_selector.py"
      - "rocket_trader_news_event_assessment.py"
      - "tests/test_rocket_trader_regime_observer.py"
      - "tests/test_rocket_trader_regime_selector.py"
      - "tests/test_rocket_trader_news_event_assessment.py"
      - ".github/workflows/rocket-trader-stream-runtime-tests.yml"

jobs:
  observer-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research comparison dependencies
        run: pip install -r requirements-yahoo.txt
      - name: Compile observer and accounting modules
        run: python -m py_compile rocket_trader_stream_runtime.py rocket_trader_stream_runtime_test.py rocket_trader_realized_pnl_ledger.py rocket_trader_paper_fill_ledger_bridge.py rocket_trader_alpaca_fee_resolver.py rocket_trader_fx_provider.py rocket_trader_alpaca_activity_stager.py rocket_trader_alpaca_activity_stager_test.py rocket_trader_alpaca_cash_activity_bridge.py rocket_trader_alpaca_cash_activity_bridge_test.py rocket_trader_currency.py rocket_trader_paper_activity_reconciliation.py rocket_trader_paper_activity_reconciliation_test.py rocket_trader_paper_reconciliation.py rocket_trader_paper_reconciliation_test.py rocket_trader_regime_observer.py rocket_trader_regime_selector.py rocket_trader_news_event_assessment.py rocket_trader_execution_cost_telemetry.py
      - name: Run offline runtime and accounting tests
        run: |
          python -m unittest -v rocket_trader_stream_runtime_test.py
          python -m unittest discover -s tests -p "test_rocket_trader_execution_cost_telemetry.py" -v
          python -m unittest -v rocket_trader_realized_pnl_ledger_test.py
          python -m unittest -v rocket_trader_paper_fill_ledger_bridge_test.py
          python -m unittest -v rocket_trader_alpaca_fee_resolver_test.py
          python -m unittest -v rocket_trader_fx_provider_test.py
          python -m unittest -v rocket_trader_alpaca_activity_stager_test.py
          python -m unittest -v rocket_trader_alpaca_cash_activity_bridge_test.py
          python -m unittest -v rocket_trader_paper_activity_reconciliation_test.py
          python -m unittest -v rocket_trader_paper_reconciliation_test.py
          python -m unittest discover -s tests -p "test_rocket_trader_regime_observer.py" -v
          python -m unittest discover -s tests -p "test_rocket_trader_regime_selector.py" -v
          python -m unittest discover -s tests -p "test_rocket_trader_news_event_assessment.py" -v
          python -m unittest -v rocket_trader_alpaca_yahoo_etf_crosscheck_test.py
