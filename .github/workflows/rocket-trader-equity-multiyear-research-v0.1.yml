name: Rocket Trader - Equity Multi-year Benchmark Research v0.1

on:
  push:
    branches:
      - main
      - "research/equity-multiyear-benchmarks-v0-1"
    paths:
      - "rocket_trader_equity_multiyear_research_v0_1.py"
      - ".github/workflows/rocket-trader-equity-multiyear-research-v0.1.yml"
  pull_request:
    branches:
      - main
    paths:
      - "rocket_trader_equity_multiyear_research_v0_1.py"
      - ".github/workflows/rocket-trader-equity-multiyear-research-v0.1.yml"
  workflow_dispatch:
    inputs:
      years:
        description: Calendar years of adjusted daily ETF data (minimum 3)
        required: false
        default: '5'
        type: string
      feed:
        description: Free SIP for historical data ending 15+ minutes ago; IEX for recent/live data
        required: false
        default: 'SIP'
        type: choice
        options:
          - IEX
          - SIP
  schedule:
    - cron: '0 17 * * 0'

permissions:
  contents: read

concurrency:
  group: rocket-trader-equity-multiyear-research
  cancel-in-progress: false

jobs:
  equity-research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-alpaca.txt
      - name: Offline self-test
        run: python rocket_trader_equity_multiyear_research_v0_1.py --self-test
      - name: Run five-year adjusted ETF research
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          YEARS_INPUT: ${{ inputs.years || '5' }}
          FEED_INPUT: ${{ inputs.feed || 'SIP' }}
        run: |
          python rocket_trader_equity_multiyear_research_v0_1.py --years "$YEARS_INPUT" --feed "$FEED_INPUT" --output research_artifacts/equity_multiyear_research_v0_1.json
      - name: Verify research-only report
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research_artifacts/equity_multiyear_research_v0_1.json').read_text())
          assert d['ok'] is True
          assert d['orders_enabled'] is False and d['orders_submitted'] == 0
          assert d['candidate_promotion_allowed'] is False and d['paper_approval'] is False
          print('Data quality pass:', d.get('data_quality_pass'))
          print('Data-quality issues:', d.get('symbols_with_data_quality_issues'))
          PY
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        with:
          name: rocket-trader-equity-multiyear-research-v0-1
          path: research_artifacts/
          if-no-files-found: warn
          retention-days: 30
