name: Rocket Trader Reference Benchmark Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "rocket_trader_reference_benchmark.py"
      - "tests/test_rocket_trader_reference_benchmark.py"
      - ".github/workflows/rocket-trader-reference-benchmark-tests.yml"
  push:
    branches: [main]
    paths:
      - "rocket_trader_reference_benchmark.py"
      - "tests/test_rocket_trader_reference_benchmark.py"
      - ".github/workflows/rocket-trader-reference-benchmark-tests.yml"

permissions:
  contents: read

jobs:
  reference-benchmark-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline benchmark tests
        run: python -m unittest discover -s tests -p "test_rocket_trader_reference_benchmark.py" -v
