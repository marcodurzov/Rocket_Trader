name: Rocket Trader - Durable Paper Activity SSE Consumer Tests

on:
  push:
    branches: [main]
    paths:
      - "rocket_trader_alpaca_activity_sse_consumer.py"
      - "rocket_trader_alpaca_activity_sse_consumer_test.py"
      - "Dockerfile.paper-observer"
      - "docker-compose.paper-observer.yml"
      - "PAPER_OBSERVER_DEPLOYMENT.md"
      - ".github/workflows/rocket-trader-alpaca-activity-sse-consumer.yml"
  pull_request:
    branches: [main]
    paths:
      - "rocket_trader_alpaca_activity_sse_consumer.py"
      - "rocket_trader_alpaca_activity_sse_consumer_test.py"
      - "Dockerfile.paper-observer"
      - "docker-compose.paper-observer.yml"
      - "PAPER_OBSERVER_DEPLOYMENT.md"
      - ".github/workflows/rocket-trader-alpaca-activity-sse-consumer.yml"

permissions:
  contents: read

jobs:
  durable-activity-sse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile rocket_trader_alpaca_activity_sse_consumer.py rocket_trader_alpaca_activity_sse_consumer_test.py
      - name: Run offline durable SSE tests
        run: python -m unittest -v rocket_trader_alpaca_activity_sse_consumer_test.py
      - name: Validate Paper observer Compose configuration
        run: |
          touch .env
          ACTIVITY_SSE_BOOTSTRAP_SINCE=2026-11-11T04:55:00Z docker compose -f docker-compose.paper-observer.yml config --quiet
