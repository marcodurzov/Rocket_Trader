
name: Rocket Trader - Traditional Research v0.2

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Calendar lookback window"
        required: false
        default: "365"
        type: string
      symbols:
        description: "Space-separated US stocks/ETFs"
        required: false
        default: "SPY QQQ"
        type: string

  schedule:
    - cron: "0 15 * * 0"

permissions:
  contents: read

concurrency:
  group: rocket-trader-traditional-research-v02
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-alpaca.txt

      - name: Verify research script
        shell: bash
        run: |
          if [[ -f rocket_trader_traditional_research_v0_2.py ]]; then
            echo "Using rocket_trader_traditional_research_v0_2.py"
          elif [[ -f rocket_trader_traditional_research.py ]]; then
            echo "Using rocket_trader_traditional_research.py"
          else
            echo "ERROR: No traditional research script found."
            exit 1
          fi

      - name: Compile research code
        shell: bash
        run: |
          if [[ -f rocket_trader_traditional_research_v0_2.py ]]; then
            python -m py_compile rocket_trader_traditional_research_v0_2.py
          else
            python -m py_compile rocket_trader_traditional_research.py
          fi

      - name: Offline tests
        shell: bash
        run: |
          if [[ -f rocket_trader_traditional_research_v0_2.py ]]; then
            python rocket_trader_traditional_research_v0_2.py --self-test
          else
            echo "WARNING: Using the unversioned script; checking supported test option."
            python rocket_trader_traditional_research.py --help
          fi

      - name: Prepare research artifacts
        run: mkdir -p research_artifacts

      - name: Run research (no orders)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SYMBOLS_INPUT: ${{ inputs.symbols || 'SPY QQQ' }}
          DAYS_INPUT: ${{ inputs.days || '365' }}
        shell: bash
        run: |
          read -r -a symbols <<< "$SYMBOLS_INPUT"

          if [[ -f rocket_trader_traditional_research_v0_2.py ]]; then
            script="rocket_trader_traditional_research_v0_2.py"
          else
            script="rocket_trader_traditional_research.py"
          fi

          python "$script" \
            --symbols "${symbols[@]}" \
            --days "$DAYS_INPUT" \
            --output research_artifacts/rocket_trader_traditional_research_v0_2_results.json

      - name: Verify research report
        run: |
          test -s research_artifacts/rocket_trader_traditional_research_v0_2_results.json
          python -m json.tool research_artifacts/rocket_trader_traditional_research_v0_2_results.json > /dev/null

      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocket-trader-traditional-research-v0-2-report
          path: research_artifacts/rocket_trader_traditional_research_v0_2_results.json
          if-no-files-found: warn
          retention-days: 30
