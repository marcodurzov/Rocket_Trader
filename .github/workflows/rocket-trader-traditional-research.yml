name: Rocket Trader - Traditional Strategy Research

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Calendar lookback window"
        required: false
        default: "365"
        type: string
      symbols:
        description: "Space-separated US stocks/ETFs"
        required: false
        default: "SPY QQQ"
        type: string
  schedule:
    - cron: "0 15 * * 0" # Weekly Sunday run, 15:00 UTC

permissions:
  contents: read

concurrency:
  group: rocket-trader-traditional-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-alpaca.txt
      - name: Compile research code
        run: python -m py_compile rocket_trader_traditional_research.py
      - name: Offline tests
        run: python rocket_trader_traditional_research.py --self-test
      - name: Run research (no orders)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SYMBOLS_INPUT: ${{ inputs.symbols || 'SPY QQQ' }}
          DAYS_INPUT: ${{ inputs.days || '365' }}
        run: |
          read -r -a symbols <<< "$SYMBOLS_INPUT"
          python rocket_trader_traditional_research.py --symbols "${symbols[@]}" --days "$DAYS_INPUT" --output rocket_trader_traditional_research_results.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocket-trader-traditional-research-report
          path: rocket_trader_traditional_research_results.json
          if-no-files-found: ignore
