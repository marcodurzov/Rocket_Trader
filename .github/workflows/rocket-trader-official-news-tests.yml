name: Rocket Trader Official News Tests

on:
  pull_request:
    paths:
      - "rocket_trader_official_news.py"
      - "tests/test_rocket_trader_official_news.py"
      - ".github/workflows/rocket-trader-official-news-tests.yml"
  push:
    branches: [main]
    paths:
      - "rocket_trader_official_news.py"
      - "tests/test_rocket_trader_official_news.py"
      - ".github/workflows/rocket-trader-official-news-tests.yml"

permissions:
  contents: read

jobs:
  official-news-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -p "test_rocket_trader_official_news.py" -v
