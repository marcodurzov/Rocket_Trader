name: Rocket Trader - Reference Strategy Registry Tests

on:
  push:
    branches:
      - "feat/reference-strategy-benchmark-registry"
    paths:
      - "research/reference_strategy_registry_v0_1.json"
      - "rocket_trader_reference_strategies.py"
      - "rocket_trader_reference_strategies_test.py"
      - ".github/workflows/rocket-trader-reference-strategies-tests.yml"
  pull_request:
    paths:
      - "research/reference_strategy_registry_v0_1.json"
      - "rocket_trader_reference_strategies.py"
      - "rocket_trader_reference_strategies_test.py"
      - ".github/workflows/rocket-trader-reference-strategies-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile registry
        run: python -m py_compile rocket_trader_reference_strategies.py rocket_trader_reference_strategies_test.py

      - name: Validate sourced strategy references
        run: python rocket_trader_reference_strategies_test.py
