name: Rocket Trader - Paper Observer Deployment Rehearsal

# Ephemeral end-to-end rehearsal of the real deployment procedure on a
# temporary GitHub runner: genesis on an empty volume (real read-only Paper
# checks), start all six observer services, wait for health, back up and
# restore-test the volume, then stop. The runner and its volume are destroyed
# afterwards; this is NOT a persistent deployment. No orders are possible
# (OBSERVE_ONLY, Paper only, default-deny execution).

on:
  pull_request:
    branches: [main]
    paths:
      - "deploy/**"
      - ".github/workflows/rocket-trader-deployment-rehearsal.yml"
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: Minutes to wait for all services to become healthy
        required: false
        default: "10"
        type: string
      runner:
        description: Runner architecture (ubuntu-24.04-arm matches Oracle Ampere A1)
        required: false
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04-arm

permissions:
  contents: read

defaults:
  run:
    shell: bash  # explicit bash => -eo pipefail, so piped failures are not masked

concurrency:
  group: rocket-trader-deployment-rehearsal
  cancel-in-progress: false

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Lint deploy script and run backup tests
        run: |
          bash -n deploy/rocket_trader_deploy.sh
          shellcheck -S warning deploy/rocket_trader_deploy.sh
          python -m unittest -v deploy/sqlite_backup_test.py

  rehearsal:
    if: github.event_name == 'workflow_dispatch'
    needs: offline-checks
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      ROCKET_TRADER_BACKUP_DIR: ${{ github.workspace }}/backups
    steps:
      - uses: actions/checkout@v4
      - name: Host architecture
        run: echo "ROCKET_TRADER_REHEARSAL_ARCH $(uname -m) $(. /etc/os-release && echo "$PRETTY_NAME")"
      - name: Write private .env from Paper secrets (never printed)
        env:
          K: ${{ secrets.ALPACA_API_KEY }}
          S: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          umask 077
          printf 'ALPACA_API_KEY=%s\nALPACA_SECRET_KEY=%s\nROCKET_TRADER_ALPACA_NEWS_SYMBOLS=SPY,QQQ,IWM,BTCUSD,ETHUSD,SOLUSD\n' "$K" "$S" > .env
      - name: Genesis on empty volume (read-only Paper checks)
        id: genesis
        run: deploy/rocket_trader_deploy.sh genesis | python3 deploy/sanitize_health.py
      - name: Start six observer services
        run: deploy/rocket_trader_deploy.sh up > /dev/null && deploy/rocket_trader_deploy.sh status
      - name: Wait for health
        id: health
        env:
          WAIT_MINUTES: ${{ inputs.wait_minutes || '10' }}
        run: |
          deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          while :; do
            st="$(deploy/rocket_trader_deploy.sh status)"
            total=$(printf '%s\n' "$st" | grep -c . || true)
            healthy=$(printf '%s\n' "$st" | grep -c $'\thealthy$' || true)
            echo "$(date -u +%H:%M:%S) healthy ${healthy}/${total}"
            if [[ "$total" -ge 6 && "$healthy" -eq "$total" ]]; then echo "all_healthy=true" >> "$GITHUB_OUTPUT"; break; fi
            if [[ $(date +%s) -ge $deadline ]]; then echo "all_healthy=false" >> "$GITHUB_OUTPUT"; break; fi
            sleep 20
          done
          deploy/rocket_trader_deploy.sh status
      - name: Health detail per service (sanitized)
        if: always()
        run: |
          C="docker compose -p rocket_trader -f docker-compose.paper-observer.yml"
          echo "== rocket-trader-paper-observer"
          $C exec -T rocket-trader-paper-observer python /app/rocket_trader_stream_runtime.py --healthcheck 2>/dev/null \
            | python3 deploy/sanitize_health.py | grep -v -E 'heartbeat_age|event_age|freshness_threshold' || true
          echo "== rocket-trader-alpaca-activity-sse"
          $C exec -T rocket-trader-alpaca-activity-sse python /app/rocket_trader_alpaca_activity_sse_consumer.py \
            --db /app/data/rocket_trader_activity_sse.sqlite3 --healthcheck 2>/dev/null | python3 deploy/sanitize_health.py || true
          for pair in "rocket-trader-gdelt-news:/app/rocket_trader_gdelt_news_observer.py" \
                      "rocket-trader-official-news:/app/rocket_trader_official_news.py" \
                      "rocket-trader-alpaca-news:/app/rocket_trader_alpaca_news_observer.py" \
                      "rocket-trader-regime-observer:/app/rocket_trader_regime_observer.py"; do
            svc="${pair%%:*}"; script="${pair#*:}"
            echo "== $svc ($(docker inspect --format '{{.State.Health.Status}} restarts={{.RestartCount}}' "$svc" 2>/dev/null))"
            $C exec -T "$svc" python "$script" --healthcheck 2>/dev/null | python3 deploy/sanitize_health.py --show-errors | head -40 || true
          done
      - name: FX provider diagnostic (public USD/MXN data only)
        if: always()
        run: |
          docker compose -p rocket_trader -f docker-compose.paper-observer.yml exec -T rocket-trader-paper-observer python - <<'PY' || true
          from datetime import datetime, timezone
          from rocket_trader_fx_provider import ExchangerateDevFXProvider
          now = datetime.now(timezone.utc)
          p = ExchangerateDevFXProvider()
          try:
              d = p._fetch(now)
              eff = (d.get("effective_at") or {}).get("MXN")
              age_h = None
              if eff:
                  age_h = round((now - datetime.fromisoformat(str(eff).replace("Z", "+00:00"))).total_seconds() / 3600, 1)
              print("FX_DIAG", {"result": d.get("result"), "stale_flag": (d.get("stale") or {}).get("MXN"),
                                "effective_age_hours": age_h, "market_session": d.get("market_session")})
          except Exception as exc:
              print("FX_DIAG_FETCH_ERROR", type(exc).__name__, str(exc)[:160])
          try:
              p.quote_for_fill(now, now=now)
              print("FX_DIAG quote_for_fill=OK")
          except Exception as exc:
              print("FX_DIAG quote_for_fill_error", type(exc).__name__, str(exc)[:160])
          PY
      - name: Backup and restore test
        id: backup
        if: always()
        run: |
          deploy/rocket_trader_deploy.sh backup | grep -E '^ROCKET_TRADER_BACKUP|Backup written' | sed 's#/home/runner[^ ]*#<backup-dir>#'
          deploy/rocket_trader_deploy.sh restore-test | grep -E '^ROCKET_TRADER_BACKUP|Restore test' | sed 's#/home/runner[^ ]*#<backup-dir>#'
          echo "backup_ok=true" >> "$GITHUB_OUTPUT"
      - name: Restart survival and second-genesis refusal
        id: restart
        if: always() && steps.genesis.outcome == 'success'
        run: |
          C="docker compose -p rocket_trader -f docker-compose.paper-observer.yml"
          $C down
          deploy/rocket_trader_deploy.sh up > /dev/null
          sleep 90
          st="$(deploy/rocket_trader_deploy.sh status)"; echo "$st"
          running=$(printf '%s\n' "$st" | grep -c $'\trunning\t' || true)
          [[ "$running" -eq 6 ]] || { echo "Not all six services running after restart"; exit 1; }
          if $C run --rm --no-deps -T rocket-trader-paper-observer \
               python /app/rocket_trader_paper_genesis_admin.py --data-dir /app/data --genesis-confirmed > /tmp/regenesis.txt 2>&1; then
            echo "UNEXPECTED: second genesis succeeded"; exit 1
          fi
          grep -q "GENESIS REFUSED" /tmp/regenesis.txt
          echo "second_genesis_refused=true"
          echo "restart_ok=true" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: always()
        run: |
          echo "ROCKET_TRADER_REHEARSAL {\"genesis\": \"${{ steps.genesis.outcome }}\", \"all_healthy\": \"${{ steps.health.outputs.all_healthy }}\", \"backup_restore_ok\": \"${{ steps.backup.outputs.backup_ok }}\", \"restart_ok\": \"${{ steps.restart.outputs.restart_ok }}\", \"orders_submitted\": 0}"
          docker compose -p rocket_trader -f docker-compose.paper-observer.yml down || true
          # Gate on deployment mechanics. Service health is reported above but not
          # gated: by design the observer stays unhealthy until the cash ledger
          # anchor/full-account reconciliation is enabled on the persistent host.
          [[ "${{ steps.genesis.outcome }}" == "success" && "${{ steps.backup.outputs.backup_ok }}" == "true" && "${{ steps.restart.outputs.restart_ok }}" == "true" ]]
