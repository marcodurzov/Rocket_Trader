name: Rocket Trader - Capped Paper Crypto Execution Smoke Test v2

on:
  push:
    branches:
      - paper-crypto-execution-smoke-v2
    paths:
      - "alpaca_paper_crypto_execution_smoke.py"
      - "rocket_trader_crypto_paper_execution.py"
      - "rocket_trader_core.py"
      - ".github/workflows/paper-crypto-execution-smoke-v2.yml"

permissions:
  contents: read

jobs:
  capped-paper-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER: "true"
      ALPACA_LIVE_ENABLED: "false"
      ROCKET_TRADER_EXECUTION_MODE: "PAPER"
      ROCKET_TRADER_PAPER_SMOKE_ALLOW_ORDERS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Alpaca SDK
        run: pip install "alpaca-py>=0.43,<1.0"
      - name: Compile smoke test and adapters
        run: python -m py_compile alpaca_paper_crypto_execution_smoke.py rocket_trader_crypto_paper_execution.py rocket_trader_core.py
      - name: Submit capped Paper buy and close only broker-confirmed net quantity
        run: python alpaca_paper_crypto_execution_smoke.py
