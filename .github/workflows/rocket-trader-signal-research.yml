name: Rocket Trader - Signal Research v0.4

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Calendar lookback window (5-minute IEX bars; chunked requests)"
        required: false
        default: "365"
        type: string
      symbols:
        description: "Space-separated US stock/ETF symbols"
        required: false
        default: "SPY QQQ"
        type: string

permissions:
  contents: read

jobs:
  signal-research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-alpaca.txt

      - name: Compile research code
        run: python -m py_compile rocket_trader_signal_research.py

      - name: Offline structural and execution-assumption tests
        run: python rocket_trader_signal_research.py --self-test

      - name: Run anchored walk-forward research (no orders)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SYMBOLS_INPUT: ${{ inputs.symbols || 'SPY QQQ' }}
          DAYS_INPUT: ${{ inputs.days || '365' }}
        run: |
          read -r -a symbols <<< "$SYMBOLS_INPUT"
          python rocket_trader_signal_research.py \
            --symbols "${symbols[@]}" \
            --days "$DAYS_INPUT" \
            --horizons 3 6 12 \
            --thresholds 0.05 0.075 0.10 0.15 0.20 0.30 0.40 0.50 0.60 0.70 \
            --friction 0.00020 \
            --slippage-per-side 0.00010 \
            --selection-fraction 0.60 \
            --output rocket_trader_signal_research_results.json

      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocket-trader-signal-research-v0.4-report
          path: rocket_trader_signal_research_results.json
          if-no-files-found: ignore
