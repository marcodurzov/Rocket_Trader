name: Rocket Trader - Alpaca vs Yahoo ETF History Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "rocket_trader_alpaca_yahoo_etf_crosscheck.py"
      - "rocket_trader_alpaca_yahoo_etf_crosscheck_test.py"
      - ".github/workflows/rocket-trader-alpaca-yahoo-etf-crosscheck.yml"
  push:
    branches: [main]
    paths:
      - "rocket_trader_alpaca_yahoo_etf_crosscheck.py"
      - "rocket_trader_alpaca_yahoo_etf_crosscheck_test.py"
      - ".github/workflows/rocket-trader-alpaca-yahoo-etf-crosscheck.yml"
  workflow_dispatch:
    inputs:
      years:
        description: Historical years to compare
        required: true
        default: "10"
        type: string
      feed:
        description: Alpaca market-data feed
        required: true
        default: "IEX"
        type: choice
        options:
          - IEX
          - SIP

permissions:
  contents: read

jobs:
  adjusted-history-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Alpaca and Yahoo research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-alpaca.txt -r requirements-yahoo.txt
      - name: Compile audit and run offline tests
        run: |
          python -m py_compile rocket_trader_alpaca_yahoo_etf_crosscheck.py rocket_trader_alpaca_yahoo_etf_crosscheck_test.py
          python -m unittest -v rocket_trader_alpaca_yahoo_etf_crosscheck_test.py
      - name: Compare 10-year adjusted daily ETF history
        if: github.event_name == 'workflow_dispatch'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
        run: |
          python rocket_trader_alpaca_yahoo_etf_crosscheck.py \
            --years "${{ inputs.years }}" \
            --feed "${{ inputs.feed }}" \
            --symbols DIA EEM EFA GLD IWM QQQ SPY TLT \
            --output artifacts/alpaca_yahoo_etf_crosscheck.json
      - name: Upload immutable comparison report
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: rocket-trader-alpaca-yahoo-etf-crosscheck
          path: artifacts/alpaca_yahoo_etf_crosscheck.json
          if-no-files-found: warn
          retention-days: 30
