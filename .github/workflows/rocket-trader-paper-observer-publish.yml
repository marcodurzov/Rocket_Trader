name: Rocket Trader - Publish Paper Observer Image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.paper-observer"
      - "docker-compose.paper-observer.yml"
      - "rocket_trader_stream_runtime.py"
      - "rocket_trader_realized_pnl_ledger.py"
      - "rocket_trader_paper_fill_ledger_bridge.py"
      - "rocket_trader_alpaca_fee_resolver.py"
      - "rocket_trader_fx_provider.py"
      - ".github/workflows/rocket-trader-paper-observer-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Paper observer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.paper-observer
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
