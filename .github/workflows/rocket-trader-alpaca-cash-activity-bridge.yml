name: Rocket Trader - Alpaca External Cash Deposit Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - "rocket_trader_alpaca_cash_activity_bridge.py"
      - "rocket_trader_alpaca_cash_activity_bridge_test.py"
      - "rocket_trader_cash_activity_admin.py"
      - "rocket_trader_cash_activity_admin_test.py"
      - "rocket_trader_realized_pnl_ledger.py"
      - "rocket_trader_realized_pnl_ledger_test.py"
      - ".github/workflows/rocket-trader-alpaca-cash-activity-bridge.yml"
  push:
    branches: [main]
    paths:
      - "rocket_trader_alpaca_cash_activity_bridge.py"
      - "rocket_trader_alpaca_cash_activity_bridge_test.py"
      - "rocket_trader_realized_pnl_ledger.py"
      - "rocket_trader_realized_pnl_ledger_test.py"
      - ".github/workflows/rocket-trader-alpaca-cash-activity-bridge.yml"

permissions:
  contents: read

jobs:
  external-deposit-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile deposit bridge and ledger
        run: python -m py_compile rocket_trader_alpaca_cash_activity_bridge.py rocket_trader_alpaca_cash_activity_bridge_test.py rocket_trader_cash_activity_admin.py rocket_trader_cash_activity_admin_test.py rocket_trader_realized_pnl_ledger.py
      - name: Run offline deposit and ledger regression tests
        run: |
          python -m unittest -v rocket_trader_alpaca_cash_activity_bridge_test.py
          python -m unittest -v rocket_trader_cash_activity_admin_test.py
          python -m unittest -v rocket_trader_realized_pnl_ledger_test.py
