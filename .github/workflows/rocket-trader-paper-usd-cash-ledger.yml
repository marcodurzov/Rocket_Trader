name: Rocket Trader - Paper USD Cash Ledger

on:
  push:
    branches:
      - main
    paths:
      - "rocket_trader_alpaca_cash_ledger.py"
      - "rocket_trader_alpaca_cash_ledger_test.py"
      - "rocket_trader_alpaca_activity_sse_consumer.py"
      - "rocket_trader_alpaca_activity_sse_consumer_test.py"
      - ".github/workflows/rocket-trader-paper-usd-cash-ledger.yml"
  pull_request:
    branches:
      - main
    paths:
      - "rocket_trader_alpaca_cash_ledger.py"
      - "rocket_trader_alpaca_cash_ledger_test.py"
      - "rocket_trader_alpaca_activity_sse_consumer.py"
      - "rocket_trader_alpaca_activity_sse_consumer_test.py"
      - ".github/workflows/rocket-trader-paper-usd-cash-ledger.yml"

permissions:
  contents: read

jobs:
  paper-usd-cash-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile rocket_trader_alpaca_cash_ledger.py rocket_trader_alpaca_cash_ledger_test.py rocket_trader_alpaca_activity_sse_consumer.py rocket_trader_alpaca_activity_sse_consumer_test.py
      - name: Run offline USD cash ledger tests
        run: python -m unittest -v rocket_trader_alpaca_cash_ledger_test.py
