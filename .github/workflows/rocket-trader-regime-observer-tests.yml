name: Rocket Trader Regime Observer Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "rocket_trader_regime_selector.py"
      - "rocket_trader_regime_observer.py"
      - "rocket_trader_news_event_assessment.py"
      - "tests/test_rocket_trader_news_event_assessment.py"
      - "tests/test_rocket_trader_regime_selector.py"
      - "tests/test_rocket_trader_regime_observer.py"
      - ".github/workflows/rocket-trader-regime-observer-tests.yml"
  push:
    branches: [main]
    paths:
      - "rocket_trader_regime_selector.py"
      - "rocket_trader_regime_observer.py"
      - "rocket_trader_news_event_assessment.py"
      - "tests/test_rocket_trader_regime_observer.py"
      - "tests/test_rocket_trader_regime_selector.py"
      - "tests/test_rocket_trader_news_event_assessment.py"
      - ".github/workflows/rocket-trader-regime-observer-tests.yml"

permissions:
  contents: read

jobs:
  regime-observer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline tests
        run: python -m unittest discover -s tests -p "test_rocket_trader_*regime*.py" -v && python -m unittest discover -s tests -p "test_rocket_trader_news_event_assessment.py" -v
