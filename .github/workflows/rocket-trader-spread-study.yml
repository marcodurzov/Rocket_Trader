name: Rocket Trader - Quoted Spread Study v0.1

on:
  pull_request:
    branches: [main]
    paths:
      - "rocket_trader_spread_study.py"
      - "rocket_trader_spread_study_test.py"
      - ".github/workflows/rocket-trader-spread-study.yml"
  workflow_dispatch:
    inputs:
      sessions:
        description: Completed XNYS sessions to sample (pre-registered 40)
        required: false
        default: "40"
        type: string
      crypto_days:
        description: Days of hourly crypto samples (pre-registered 14)
        required: false
        default: "14"
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-alpaca.txt -r requirements-yahoo.txt
      - run: python -m unittest -v rocket_trader_spread_study_test.py

  measure:
    if: github.event_name == 'workflow_dispatch'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-alpaca.txt -r requirements-yahoo.txt
      - name: Measure quoted spreads (read-only market data)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python rocket_trader_spread_study.py --sessions "${{ inputs.sessions || '40' }}" \
            --crypto-days "${{ inputs.crypto_days || '14' }}" --output research_artifacts/spread_study_v0_1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rocket-trader-spread-study-v0-1
          path: research_artifacts/
          if-no-files-found: warn
          retention-days: 90
