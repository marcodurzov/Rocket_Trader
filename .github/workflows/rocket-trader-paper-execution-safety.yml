name: Rocket Trader - Paper Execution Safety

on:
  push:
    branches:
      - "feat/paper-execution-idempotency"
    paths:
      - "rocket_trader_paper_execution.py"
      - "rocket_trader_paper_execution_test.py"
      - "rocket_trader_core.py"
      - "rocket_trader_live_mode_guard_test.py"
      - ".github/workflows/rocket-trader-paper-execution-safety.yml"
  pull_request:
    paths:
      - "rocket_trader_paper_execution.py"
      - "rocket_trader_paper_execution_test.py"
      - ".github/workflows/rocket-trader-paper-execution-safety.yml"

permissions:
  contents: read

jobs:
  paper-execution-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-alpaca.txt
      - name: Compile
        run: python -m py_compile rocket_trader_core.py rocket_trader_paper_execution.py rocket_trader_paper_execution_test.py rocket_trader_live_mode_guard_test.py
      - name: Offline execution safety tests (no broker connection and no orders)
        run: |
          python rocket_trader_paper_execution_test.py
          python rocket_trader_live_mode_guard_test.py
